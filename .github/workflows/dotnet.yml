# Build-only CI. PicoGK generation and the Blazor app server are intentionally not run here:
# this MVP validates geometry locally, and GitHub-hosted runners may lack the
# graphics/native runtime dependencies PicoGK expects for headless generation.
name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Mechnain.PicoGK.Workbench.sln

      - name: Build
        run: dotnet build Mechnain.PicoGK.Workbench.sln --configuration Release --no-restore
